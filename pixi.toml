[workspace]
authors = ["Your name <your@email.com>"]
channels = ["conda-forge", "munch-group", "gwforg"]
name = "itrails"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
git = "*"
gh = "*"
pip = "*"
git-lfs = "*"
nodejs = "*"
seaborn = "*"
pytables = "*"
scipy = "*"
statsmodels = "*"
ipykernel = ">=7.3.0,<8"
jupyter = "*"
nbconvert = "*"
vscodenb = ">=1.0.5,<2"
r-rsvg = "*"
geneinfo = ">=5.6.5,<6"
quarto = ">=1.7.33,<2"
biopython = ">=1.88,<2"
gwf = ">=2.1.1,<3"
msprime = ">=1.3,<2"


# Isolated environment for the iTRAILS tool itself. Kept out of the default
# environment because itrails pins numpy/scipy/numba and pulls in ray.
# Workflow specs run commands as: pixi run -e itrails itrails-optimize ...
[feature.itrails.dependencies]
# itrails needs >=3.12 but its pinned numba needs <3.13
python = ">=3.12,<3.13"
pip = "*"

[feature.itrails.pypi-dependencies]
# 2.x is the series documented at itrails.readthedocs.io (docs-stable);
# 0.1.x has an incompatible CLI (directory outputs, no --config-file)
itrails = ">=2.0.5, <3"

[environments]
itrails = { features = ["itrails"], no-default-feature = true }

[tasks.simulate-example]
cmd = "python scripts/simulate_data.py"
description = "Regenerate the simulated great-ape-like example alignment (data/simulated_alignment.maf)"

[tasks.download-example]
cmd = "mkdir -p data && curl -L -o data/example_alignment.maf https://zenodo.org/records/14930374/files/example_alignment.maf"
description = "Download the great-ape example alignment (183 MB) used by the example analysis"

[tasks.init]
cmd = "python ./scripts/rename.py && git remote set-url \"origin\" git@github.com:munch-group/$(basename $(git rev-parse --show-toplevel))"

[tasks.docs]
cmd = "./scripts/docs-run-notebooks.sh && git add -u notebooks"
description = "Run documentation notebooks"

[tasks.clean]
cmd = "git clean -id"
description = "Removes untracked files and directories but respects your .gitignores"

[tasks.commit]
depends-on = ["docs"]
cmd = "./scripts/git-commit.sh"
description = "Commits with message made by Claude"



